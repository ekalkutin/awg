services:
  awg:
    image: ${AWG_IMAGE:-ekalkutin/tunnel:latest}
    # Only used by "docker compose build" on your machine; the server just pulls the image.
    build: .
    container_name: awg
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # not needed for build; at runtime the container refuses to start without AWG_PORT
    ports:
      - "${AWG_PORT:-47123}:${AWG_PORT:-47123}/udp"
    volumes:
      # The whole server: keys, params, peers, client configs. Back it up.
      - ./data:/data
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"
